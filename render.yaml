services:
  - type: worker
    name: furry-roleplay-discord-bot
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    preDeployCommand: npm run register
    startCommand: npm start
    disk:
      name: furry-roleplay-bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: OPENAI_TTS_VOICE
        value: nova
